name: Build BeautyCamera AAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.0"

      - name: Build AAR (release)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.5
          arguments: :library:assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp library/build/outputs/aar/library-release.aar artifact/BeautyCamera.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: BeautyCamera.aar
          path: artifact/BeautyCamera.aar
